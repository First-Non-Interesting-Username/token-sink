[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokensink"
version = "0.0.1"
description = "Multi-agent security vulnerability research system (PLAN.md)"
requires-python = ">=3.12"
dependencies = [
    # Kept minimal for Phase 1: config parsing + validation only.
    "pyyaml>=6.0",
    # stdlib tomllib covers TOML; no extra dep needed.
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokensink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
