[project]
name = "token-sink"
version = "0.0.0"
description = "Multi-agent security vulnerability research system (see PLAN.md)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
token-sink = "cli:main"

[build-system]
# Hatchling: zero-config build backend that packages the flat top-level
# packages listed below. Kept explicit so adding a new subsystem package
# is a conscious choice, not an accident of auto-discovery.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "agents", "api", "config", "findings", "fixtures", "observability",
  "orchestrator", "policy", "providers", "routers", "schemas", "search",
"storage", "tools", "ui"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# CI safety net: no placeholder test should ever hang the pipeline
timeout = 60
addopts = "-ra"
markers = [
    "integration: end-to-end tests across subsystems",
    "safety: security guardrail tests (must never be skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
