[project]
name = "token-sink"
version = "0.0.0"
description = "Multi-agent security vulnerability research system (see PLAN.md)"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI safety net: no placeholder test should ever hang the pipeline
timeout = 60
addopts = "-ra"
markers = [
    "integration: end-to-end tests across subsystems",
    "safety: security guardrail tests (must never be skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
