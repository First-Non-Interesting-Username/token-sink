<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MAVR · Live activity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/mavr.css" />
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/mavr.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">MAVR</div>
    <nav class="nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/activity" class="active">Activity</a>
      <a href="/findings">Findings</a>
      <a href="/providers">Providers</a>
      <a href="/usage">Usage</a>
      <a href="/policy">Policy</a>
      <a href="/logs">Logs</a>
    </nav>
    <div class="status" id="ks-banner" data-state="off">kill switch: <span>off</span></div>
  </header>
  <main>
    <h1>Live activity</h1>
    <p class="muted">Each row is one <code>system_event</code>. Click an event id to copy.</p>
    <div id="event-list" class="event-list" hx-ext="sse" sse-connect="/api/events/stream" sse-swap="message">
      <em>connecting…</em>
    </div>
  </main>
  <input id="api-token" type="hidden" value="{{ token }}" />
</body>
</html>
